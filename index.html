<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Showdown - 3D Arcade Fighter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 10; }
    .player-hud { width: 42%; background: rgba(0,0,0,0.65); padding: 15px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); }
    .player-name { font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
    .power-name { font-size: 13px; color: #ffeb3b; font-weight: bold; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 22px; background: #333; border-radius: 4px; overflow: hidden; border: 1px solid #555; position: relative; }
    .health-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff416c, #ff4b2b); transition: width 0.15s ease-out; }
    .power-bar { height: 8px; width: 0%; background: linear-gradient(90deg, #00c6ff, #0072ff); margin-top: 6px; border-radius: 3px; transition: width 0.1s; }
    .vs-badge { font-size: 36px; font-weight: 900; color: #ff4757; text-shadow: 0 0 10px #000, 2px 2px 0 #fff; margin-top: 10px; }
    #select-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1c29 0%, #0a0b10 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
    h1 { font-size: 48px; text-transform: uppercase; letter-spacing: 3px; color: #fffa65; text-shadow: 0 0 15px rgba(255,250,101,0.5); margin-bottom: 10px; }
    .subtitle { font-size: 18px; color: #aaa; margin-bottom: 30px; }
    .roster { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 900px; margin-bottom: 30px; }
    .card { width: 110px; height: 140px; background: rgba(255,255,255,0.05); border: 2px solid #444; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; padding: 10px; text-align: center; }
    .card:hover { transform: translateY(-5px); border-color: #fffa65; background: rgba(255,250,101,0.1); }
    .card.p1-selected { border-color: #00d2d3; background: rgba(0,210,211,0.2); box-shadow: 0 0 15px #00d2d3; }
    .card.p2-selected { border-color: #ff4757; background: rgba(255,71,87,0.2); box-shadow: 0 0 15px #ff4757; }
    .card.boss { border-color: #ffa502; background: rgba(255,165,2,0.15); }
    .card-name { font-weight: bold; font-size: 14px; margin-top: 8px; }
    .card-power { font-size: 10px; color: #ffda79; margin-top: 4px; }
    .btn { padding: 14px 40px; font-size: 20px; font-weight: bold; text-transform: uppercase; background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,71,87,0.4); transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(255,71,87,0.6); }
    #controls-info { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; color: #ccc; font-size: 13px; z-index: 10; pointer-events: none; text-align: center; }
    .key { background: #444; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 30; color: white; }
    #winner-text { font-size: 52px; font-weight: 900; color: #fffa65; text-shadow: 0 0 20px #fffa65; margin-bottom: 20px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="select-screen">
    <h1>Campus Showdown</h1>
    <div class="subtitle">Select Fighter (Player 1: Blue | AI / Opponent: Red)</div>
    <div class="roster" id="roster"></div>
    <button class="btn" id="start-btn" onclick="startGame()">FIGHT!</button>
  </div>
  <div id="hud" style="display:none;">
    <div class="player-hud">
      <div class="player-name"><span id="p1-name-txt">Gaurav</span><span style="font-size:12px;color:#00d2d3;">P1</span></div>
      <div class="power-name" id="p1-power-txt">Sonic Soundwave</div>
      <div class="bar-bg"><div class="health-bar" id="p1-hp"></div></div>
      <div class="power-bar" id="p1-sp"></div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player-hud">
      <div class="player-name"><span style="font-size:12px;color:#ff4757;">CPU</span><span id="p2-name-txt">Pranjal (Boss)</span></div>
      <div class="power-name" id="p2-power-txt" style="text-align:right;">Final Exam Apocalypse</div>
      <div class="bar-bg"><div class="health-bar" id="p2-hp"></div></div>
      <div class="power-bar" id="p2-sp" style="margin-left:auto;"></div>
    </div>
  </div>
  <div id="controls-info">
    <span class="key">A</span> / <span class="key">D</span> Move | <span class="key">W</span> Jump | <span class="key">J</span> Punch | <span class="key">K</span> Kick | <span class="key">Space</span> / <span class="key">L</span> Super Power
  </div>
  <div id="game-over">
    <div id="winner-text">GAURAV WINS!</div>
    <button class="btn" onclick="resetToSelect()">REMATCH / SELECT</button>
  </div>
  <script>
    const CHARACTERS = [
      { id: 'gaurav', name: 'Gaurav Pareek', power: 'Sonic Soundwave', color: 0x3498db, shirt: 0x2980b9, hat: false },
      { id: 'abhishek', name: 'Abhishek', power: 'Code Rush', color: 0x2ecc71, shirt: 0x27ae60, hat: false },
      { id: 'varun', name: 'Varun', power: 'Fire Typhoon', color: 0xe67e22, shirt: 0xd35400, hat: false },
      { id: 'amal', name: 'Amal Tom', power: 'Thunder Kick', color: 0x9b59b6, shirt: 0x8e44ad, hat: false },
      { id: 'mukesh', name: 'Mukesh Thakur', power: 'Iron Wall', color: 0x95a5a6, shirt: 0x7f8c8d, hat: false },
      { id: 'sanjay', name: 'Sanjay Topi', power: 'Hat Trick Slash', color: 0x1abc9c, shirt: 0x16a085, hat: true },
      { id: 'pranjal', name: 'Pranjal (Boss)', power: 'Final Exam Apocalypse', color: 0xe74c3c, shirt: 0xc0392b, boss: true }
    ];
    let p1Index = 0, p2Index = 6;
    const rosterEl = document.getElementById('roster');
    CHARACTERS.forEach((char, idx) => {
      const card = document.createElement('div');
      card.className = `card ${char.boss ? 'boss' : ''} ${idx === p1Index ? 'p1-selected' : ''}`;
      card.id = `card-${idx}`;
      card.innerHTML = `<div style="font-size:24px;">${char.boss ? '👑' : '👤'}</div><div class="card-name">${char.name}</div><div class="card-power">${char.power}</div>`;
      card.onclick = () => selectCharacter(idx);
      rosterEl.appendChild(card);
    });
    function selectCharacter(idx) {
      document.getElementById(`card-${p1Index}`).classList.remove('p1-selected');
      p1Index = idx;
      document.getElementById(`card-${p1Index}`).classList.add('p1-selected');
      p2Index = (p1Index === 6) ? 0 : 6;
    }
    let scene, camera, renderer, p1, p2, keys = {}, gameActive = false, particles = [];
    function initScene() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 16);
      camera.lookAt(0, 2, 0);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 15);
      dirLight.castShadow = true;
      scene.add(dirLight);
      buildCampusArena();
      window.addEventListener('resize', onWindowResize);
    }
    function buildCampusArena() {
      const groundGeo = new THREE.PlaneGeometry(60, 30);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const trackGeo = new THREE.RingGeometry(10, 14, 32);
      const trackMat = new THREE.MeshBasicMaterial({ color: 0xd35400, side: THREE.DoubleSide });
      const track = new THREE.Mesh(trackGeo, trackMat);
      track.rotation.x = -Math.PI / 2;
      track.position.y = 0.01;
      scene.add(track);
      const b1Geo = new THREE.BoxGeometry(12, 10, 8);
      const b1Mat = new THREE.MeshStandardMaterial({ color: 0xb2bec3 });
      const b1 = new THREE.Mesh(b1Geo, b1Mat);
      b1.position.set(-18, 5, -10);
      b1.castShadow = true;
      scene.add(b1);
      for (let x = -22; x <= -14; x += 3) {
        for (let y = 3; y <= 8; y += 2.5) {
          const winGeo = new THREE.PlaneGeometry(1.2, 1.2);
          const winMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
          const win = new THREE.Mesh(winGeo, winMat);
          win.position.set(x, y, -5.9);
          scene.add(win);
        }
      }
      const archPillarGeo = new THREE.BoxGeometry(1.5, 8, 1.5);
      const archMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
      const pLeft = new THREE.Mesh(archPillarGeo, archMat);
      pLeft.position.set(-6, 4, -8);
      const pRight = new THREE.Mesh(archPillarGeo, archMat);
      pRight.position.set(6, 4, -8);
      scene.add(pLeft); scene.add(pRight);
      const archTopGeo = new THREE.BoxGeometry(14, 1.5, 1.5);
      const archTop = new THREE.Mesh(archTopGeo, archMat);
      archTop.position.set(0, 8, -8);
      scene.add(archTop);
      const canteenGeo = new THREE.BoxGeometry(10, 7, 8);
      const canteenMat = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
      const canteen = new THREE.Mesh(canteenGeo, canteenMat);
      canteen.position.set(16, 3.5, -10);
      scene.add(canteen);
      for (let i = -22; i <= 22; i += 8) {
        if (Math.abs(i) < 8) continue;
        createTree(i, -6);
      }
    }
    function createTree(x, z) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
      trunk.position.set(x, 1.5, z);
      trunk.castShadow = true;
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 8), new THREE.MeshStandardMaterial({ color: 0x1b5e20 }));
      leaves.position.set(x, 4.5, z);
      leaves.castShadow = true;
      scene.add(trunk); scene.add(leaves);
    }
    class Character {
      constructor(info, isP1, xPos) {
        this.info = info; this.isP1 = isP1; this.hp = 100; this.sp = 0; this.isGrounded = true; this.vy = 0; this.isAttacking = false; this.facingRight = isP1;
        this.mesh = new THREE.Group(); this.mesh.position.set(xPos, 0, 0);
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const shirtMat = new THREE.MeshStandardMaterial({ color: info.shirt });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
        this.head.position.y = 2.4; this.head.castShadow = true; this.mesh.add(this.head);
        if (info.hat) {
          const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.3, 12), new THREE.MeshStandardMaterial({ color: 0x111 }));
          hat.position.y = 0.55; this.head.add(hat);
        } else if (info.boss) {
          const crown = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.4, 5), new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8 }));
          crown.position.y = 0.6; this.head.add(crown);
        }
        this.torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.6), shirtMat);
        this.torso.position.y = 1.4; this.torso.castShadow = true; this.mesh.add(this.torso);
        const armGeo = new THREE.BoxGeometry(0.3, 1, 0.3);
        this.leftArm = new THREE.Mesh(armGeo, skinMat); this.leftArm.position.set(-0.65, 1.4, 0);
        this.rightArm = new THREE.Mesh(armGeo, skinMat); this.rightArm.position.set(0.65, 1.4, 0);
        this.mesh.add(this.leftArm); this.mesh.add(this.rightArm);
        const legGeo = new THREE.BoxGeometry(0.35, 1.1, 0.35);
        this.leftLeg = new THREE.Mesh(legGeo, pantsMat); this.leftLeg.position.set(-0.3, 0.55, 0);
        this.rightLeg = new THREE.Mesh(legGeo, pantsMat); this.rightLeg.position.set(0.3, 0.55, 0);
        this.mesh.add(this.leftLeg); this.mesh.add(this.rightLeg);
        scene.add(this.mesh); this.updateFacing();
      }
      updateFacing() { this.mesh.rotation.y = this.facingRight ? Math.PI / 2 : -Math.PI / 2; }
      move(dir) {
        if (this.isAttacking) return;
        this.mesh.position.x += dir * 0.15;
        this.mesh.position.x = Math.max(-12, Math.min(12, this.mesh.position.x));
        const time = Date.now() * 0.01;
        this.leftLeg.rotation.x = Math.sin(time) * 0.5;
        this.rightLeg.rotation.x = -Math.sin(time) * 0.5;
      }
      jump() { if (this.isGrounded) { this.vy = 0.22; this.isGrounded = false; } }
      punch(target) {
        if (this.isAttacking) return;
        this.isAttacking = true;
        const arm = this.rightArm; arm.position.z = 0.6; arm.rotation.x = -Math.PI / 2;
        this.checkHit(target, 1.8, 10, "PUNCH");
        setTimeout(() => { arm.position.z = 0; arm.rotation.x = 0; this.isAttacking = false; }, 200);
      }
      kick(target) {
        if (this.isAttacking) return;
        this.isAttacking = true;
        const leg = this.rightLeg; leg.position.z = 0.6; leg.rotation.x = -Math.PI / 2;
        this.checkHit(target, 2.0, 15, "KICK");
        setTimeout(() => { leg.position.z = 0; leg.rotation.x = 0; this.isAttacking = false; }, 250);
      }
      superPower(target) {
        if (this.isAttacking || this.sp < 100) return;
        this.isAttacking = true; this.sp = 0; updateHUD();
        createSuperEffect(this.mesh.position.x, this.info.color);
        this.checkHit(target, 4.0, 35, "SUPER POWER!");
        setTimeout(() => { this.isAttacking = false; }, 500);
      }
      checkHit(target, range, damage, typeName) {
        const dist = Math.abs(this.mesh.position.x - target.mesh.position.x);
        if (dist <= range) {
          target.takeDamage(damage);
          this.sp = Math.min(100, this.sp + 20); updateHUD();
          createHitParticles(target.mesh.position.x, target.mesh.position.y + 1.5);
        }
      }
      takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount); updateHUD();
        this.torso.material.color.setHex(0xff0000);
        setTimeout(() => this.torso.material.color.setHex(this.info.shirt), 150);
        if (this.hp <= 0) { endGame(this.isP1 ? p2.info.name : p1.info.name); }
      }
      update() {
        if (!this.isGrounded) {
          this.mesh.position.y += this.vy; this.vy -= 0.012;
          if (this.mesh.position.y <= 0) { this.mesh.position.y = 0; this.isGrounded = true; this.vy = 0; }
        }
      }
    }
    function createHitParticles(x, y) {
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshBasicMaterial({ color: 0xfff200 }));
        p.position.set(x, y, 0); p.vx = (Math.random() - 0.5) * 0.2; p.vy = Math.random() * 0.2; p.life = 15;
        scene.add(p); particles.push(p);
      }
    }
    function createSuperEffect(x, colorHex) {
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true, transparent: true, opacity: 0.8 }));
      sphere.position.set(x, 1.5, 0); scene.add(sphere);
      let scale = 1;
      const interval = setInterval(() => {
        scale += 0.2; sphere.scale.set(scale, scale, scale); sphere.material.opacity -= 0.1;
        if (sphere.material.opacity <= 0) { clearInterval(interval); scene.remove(sphere); }
      }, 30);
    }
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.position.x += p.vx; p.position.y += p.vy; p.life--;
        if (p.life <= 0) { scene.remove(p); particles.splice(i, 1); }
      }
    }
    function updateAI() {
      if (!gameActive || !p2) return;
      const dist = p1.mesh.position.x - p2.mesh.position.x;
      p2.facingRight = dist > 0; p2.updateFacing();
      if (Math.abs(dist) > 1.5) { p2.move(Math.sign(dist) * 0.6); }
      else {
        const rand = Math.random();
        if (p2.sp >= 100) { p2.superPower(p1); }
        else if (rand < 0.03) { p2.punch(p1); }
        else if (rand < 0.06) { p2.kick(p1); }
      }
    }
    function startGame() {
      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      const p1Info = CHARACTERS[p1Index]; const p2Info = CHARACTERS[p2Index];
      document.getElementById('p1-name-txt').innerText = p1Info.name;
      document.getElementById('p1-power-txt').innerText = p1Info.power;
      document.getElementById('p2-name-txt').innerText = p2Info.name;
      document.getElementById('p2-power-txt').innerText = p2Info.power;
      p1 = new Character(p1Info, true, -4); p2 = new Character(p2Info, false, 4);
      p1.facingRight = true; p2.facingRight = false;
      updateHUD(); gameActive = true;
    }
    function updateHUD() {
      if (!p1 || !p2) return;
      document.getElementById('p1-hp').style.width = p1.hp + '%';
      document.getElementById('p2-hp').style.width = p2.hp + '%';
      document.getElementById('p1-sp').style.width = p1.sp + '%';
      document.getElementById('p2-sp').style.width = p2.sp + '%';
    }
    function endGame(winnerName) {
      gameActive = false;
      document.getElementById('winner-text').innerText = `${winnerName.toUpperCase()} WINS!`;
      document.getElementById('game-over').style.display = 'flex';
    }
    function resetToSelect() { location.reload(); }
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (!gameActive) return;
      if (e.code === 'KeyJ') p1.punch(p2);
      if (e.code === 'KeyK') p1.kick(p2);
      if (e.code === 'Space' || e.code === 'KeyL') p1.superPower(p2);
      if (e.code === 'KeyW') p1.jump();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    function processInput() {
      if (!gameActive || !p1) return;
      if (keys['KeyA']) { p1.move(-1); p1.facingRight = false; p1.updateFacing(); }
      if (keys['KeyD']) { p1.move(1); p1.facingRight = true; p1.updateFacing(); }
    }
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    function animate() {
      requestAnimationFrame(animate);
      if (gameActive) {
        processInput(); p1.update(); p2.update(); updateAI(); updateParticles();
        const avgX = (p1.mesh.position.x + p2.mesh.position.x) / 2;
        camera.position.x += (avgX - camera.position.x) * 0.05;
      }
      renderer.render(scene, camera);
    }
    initScene(); animate();
  </script>
</body>
</html>
