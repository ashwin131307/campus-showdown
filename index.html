<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Campus Showdown — 3D Friends Edition</title>
    <style>
      body { margin: 0; overflow: hidden; background: #0b0f19; font-family: 'Teko', sans-serif; user-select: none; }
      #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
      .hud-top { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 28px; text-shadow: 2px 2px #000; }
      .bar-box { width: 40%; background: rgba(0,0,0,0.6); border: 3px solid #ff9933; padding: 10px; border-radius: 8px; }
      .hp-track { width: 100%; height: 22px; background: #444; border-radius: 4px; overflow: hidden; margin-top: 5px; }
      .hp-fill { width: 100%; height: 100%; background: #22b35e; transition: width 0.2s; }
      .center-info { text-align: center; font-size: 36px; color: #ffd700; font-weight: bold; }
      #controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #aaa; font-size: 18px; text-shadow: 1px 1px #000; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div class="hud-top">
        <div class="bar-box">
          <div id="p1-name">GAURAV PAREEK (1P)</div>
          <div class="hp-track"><div id="p1-hp" class="hp-fill"></div></div>
        </div>
        <div class="center-info">CAMPUS SHOWDOWN<br><span id="timer" style="font-size:22px; color:#fff;">60</span></div>
        <div class="bar-box" style="text-align: right; border-color: #2e9bff;">
          <div id="p2-name">ABHISHEK (CPU)</div>
          <div class="hp-track"><div id="p2-hp" class="hp-fill" style="background:#e0262f;"></div></div>
        </div>
      </div>
      <div id="controls-hint">Move: A / D &nbsp;|&nbsp; Jump: W &nbsp;|&nbsp; Punch: J &nbsp;|&nbsp; Kick: K &nbsp;|&nbsp; Super Power: Space</div>
    </div>

    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // 3D Scene Setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);
      scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 14);
      camera.lookAt(0, 2, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // College Campus Ground
      const floorGeo = new THREE.PlaneGeometry(50, 30);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Create 3D Fighter Function
      function createFighter(color) {
        const group = new THREE.Group();
        
        // Body
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), bodyMat);
        torso.position.y = 1.8;
        torso.castShadow = true;
        group.add(torso);

        // Head
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat);
        head.position.y = 3.1;
        head.castShadow = true;
        group.add(head);

        // Limbs
        const limbMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.4, 0.4), limbMat);
        lArm.position.set(-0.9, 1.8, 0);
        group.add(lArm);

        const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.4, 0.4), limbMat);
        rArm.position.set(0.9, 1.8, 0);
        group.add(rArm);

        return { group, lArm, rArm, hp: 100 };
      }

      const p1 = createFighter(0xff9933); // Gaurav Pareek
      p1.group.position.x = -3;
      scene.add(p1.group);

      const p2 = createFighter(0x2e9bff); // Abhishek
      p2.group.position.x = 3;
      scene.add(p2.group);

      // Controls State
      const keys = {};
      window.addEventListener('keydown', (e) => keys[e.code] = true);
      window.addEventListener('keyup', (e) => keys[e.code] = false);

      // Game Loop
      function animate() {
        requestAnimationFrame(animate);

        // P1 Controls
        if (keys['KeyA'] && p1.group.position.x > -12) p1.group.position.x -= 0.15;
        if (keys['KeyD'] && p1.group.position.x < p2.group.position.x - 1) p1.group.position.x += 0.15;
        
        // Punch Animation
        if (keys['KeyJ']) {
          p1.rArm.rotation.x = -Math.PI / 2;
          if (Math.abs(p1.group.position.x - p2.group.position.x) < 2) {
            p2.hp -= 0.5;
            document.getElementById('p2-hp').style.width = Math.max(0, p2.hp) + '%';
          }
        } else {
          p1.rArm.rotation.x = 0;
        }

        // CPU Simple AI
        if (p2.group.position.x > p1.group.position.x + 1.5) {
          p2.group.position.x -= 0.05;
        }

        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
